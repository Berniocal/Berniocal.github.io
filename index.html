s://bernio.cz/najdito"],["app","🗺️","Plánek","/planek","Plánek s mapou, do které můžete zakreslovat terény a herní situace.","https://berniocal.github.io/planek/"],["app","⚡","Reakční doba","/reakce","Měření reakční doby na vizuální, zvukový nebo hmatový podnět.","https://berniocal.github.io/reakce/"],["app","🅰️","Skládání slov","/skladani","Hra s písmenky – skládej slova a trénuj slovní zásobu.","https://berniocal.github.io/skladani/"],["app","💡","Světla","/svetla","Fitlight trénink s telefony pro postřeh a rychlou reakci.","https://berniocal.github.io/svetla/?v=20250915a"],["app","⏲️","Časovač","/casovac","Jednoduché stopování času při deskových hrách.","https://berniocal.github.io/casovac/"],["app","♟️","Šachy - stopky","/sachy-stopky","Stopky pro hraní šachu a měření času hráčů.","https://berniocal.github.io/sachy-stopky/"]],"hudba":[["app","🎼","Akordy → ChordPro","/akordy","Vložené akordy z Kytary.cz převede do formátu ChordPro.","https://bernio.cz/akordy"],["app","🔄","Converter","/converter","Převádí hudební zápisy mezi formáty Ultimate Guitar a ChordPro.","https://bernio.cz/converter"],["app","✂️","Zkracovač","/zkracovac","Zkrátí mezery v písničkách s akordy podle nastavených procent.","https://bernio.cz/zkracovac"],["app","📻","ZPS","/zps","Generátor playlistů do aplikace Zpěvník pro scholy včetně sdílení přes QR.","https://bernio.cz/zps"],["app","🎵","Zpěvníček","/zpjevnicek","Offline zpěvníček s akordy, playlisty a podporou ChordPro.","https://bernio.cz/zpjevnicek"]],"jine":[["app","📝","MP3 → SRT","/mp3tosrt","Přepis zvukových souborů MP3 do titulků ve formátu SRT přímo v prohlížeči.","https://bernio.cz/mp3tosrt"],["app","✋","bernio.cz/vote","/vote","Rychlé hlasování, které seřadí účastníky podle času kliknutí.","https://bernio.cz/vote"],["app","🚗","Blokové čištění","/cisteni","Upozornění na termíny blokového čištění pro vybranou ulici.","https://bernio.cz/cisteni"],["app","🪑","Zasedák","/zasedak","Tvorba a úprava zasedacích pořádků pro třídu nebo skupinu.","https://berniocal.github.io/zasedak/"],["app","🖥️","Zrcadlení obrazovky","/zrcadleni","Sdílení obrazovky telefonu na počítač.","https://berniocal.github.io/zrcadleni/"],["app","🌧️","Šumy","/sumy","Generátor šumu a ambientních zvuků pro soustředění nebo relaxaci.","https://berniocal.github.io/sumy/"]],"matika":[["app","🧮","Bernio","/Bernio","Vědecká kalkulačka ve stylu Casio pro rychlé výpočty.","https://berniocal.github.io/Bernio/"],["app","🧩","Generátor rovnic","/math","Editor a generátor rovnic s podporou algebraických úprav a krokování.","https://bernio.cz/math"],["app","📈","Kvadratické funkce","/kvadrfce","Tvary kvadratické funkce, určení předpisu ze tří bodů a grafické řešení kvadratických nerovnic.","https://bernio.cz/kvadrfce"],["app","📘","Opakování 6. třídy","/zlomky","Souhrnné opakování matematiky 6. třídy formou interaktivního procvičování.","https://berniocal.github.io/zlomky/"],["app","📦","Stereometrie","/stereometrie","Prostorová geometrie, řezy těles, vzdálenosti bodů, přímek a rovin, odchylky.","https://bernio.cz/stereometrie"],["app","🛢️","Válec","/valec","Dynamický 3D model válce, síť válce a výpočty objemu a povrchu.","https://bernio.cz/valec"],["app","✂️","Řezy těles","/rezy","Interaktivní konstrukce řezů krychlí, hranolů a dalších těles.","https://bernio.cz/rezy"]]},NAMES={"home":"Hlavní menu","fyzika":"Fyzika","vedator":"Vedátor","vesmir":"Vesmír a gravitace","hry":"Hry","hudba":"Hudba","jine":"Jiné","matika":"Matika"},PARENTS={"fyzika":"home","vedator":"fyzika","vesmir":"fyzika","hry":"home","hudba":"home","jine":"home","matika":"home"};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function homeCard(x){return `<article class="card click" data-view="${x[0]}"><div class="title"><span class="icon">${x[1]}</span><span>${esc(x[2])}</span><span class="pill">sekce</span></div><div class="desc">${esc(x[3])}</div><div class="ghost">Otevřít sekci ${esc(x[2])}</div></article>`}
function itemCard(x){if(x[0]==='sub')return `<article class="card click" data-view="${x[1]}"><div class="title"><span class="icon">${x[2]}</span><span>${esc(x[3])}</span><span class="pill">podsekce</span></div><div class="desc">${esc(x[4])}</div><div class="ghost">Otevřít podsekci ${esc(x[3])}</div></article>`;return `<article class="card"><div class="title"><span class="icon">${x[1]}</span><span>${esc(x[2])}</span><span class="pill">${esc(x[3])}</span></div><div class="desc">${esc(x[4])}</div><a class="btn" href="${esc(x[5])}" target="_blank" rel="noopener">Otevřít ${esc(x[2])} ↗</a></article>`}
const views=document.getElementById('views');views.innerHTML=`<section class="view" id="view-home"><div class="grid">${HOME.map(homeCard).join('')}</div></section>`+Object.entries(SECTIONS).map(([id,a])=>`<section class="view" id="view-${id}"><div class="top"><button class="ghost back" data-back="${PARENTS[id]}">← ${PARENTS[id]==='home'?'Zpět na hlavní menu':'Zpět do sekce Fyzika'}</button></div><div class="grid">${a.map(itemCard).join('')}</div></section>`).join('');
const map=Object.fromEntries([...document.querySelectorAll('.view')].map(v=>[v.id.slice(5),v])),sep=document.getElementById('sep'),crumb=document.getElementById('crumb');
function trail(n){let a=[];while(n&&n!=='home'){a.unshift(NAMES[n]||n);n=PARENTS[n]}return a.join(' › ')}function show(n,push=false){if(!map[n])n='home';Object.entries(map).forEach(([k,v])=>v.classList.toggle('active',k===n));const h=n!=='home';sep.hidden=!h;crumb.hidden=!h;crumb.textContent=h?trail(n):'';if(push)history.pushState({view:n},'',n==='home'?location.pathname+location.search:'#'+n);scrollTo(0,0)}function fromHash(){const n=location.hash.slice(1);return map[n]?n:'home'}
document.addEventListener('click',e=>{const c=e.target.closest('[data-view]'),b=e.target.closest('[data-back]');if(c)show(c.dataset.view,true);else if(b)show(b.dataset.back,true)});history.replaceState({view:fromHash()},'',location.href);addEventListener('popstate',()=>show(fromHash()));show(fromHash());
const theme=document.getElementById('theme'),saved=localStorage.getItem('bernio-theme'),pref=matchMedia('(prefers-color-scheme:dark)').matches;function setTheme(t){const d=t==='dark';document.body.classList.toggle('dark',d);theme.textContent=d?'☀️ Světlý režim':'🌙 Tmavý režim';document.querySelector('meta[name="theme-color"]').content=d?'#0b1323':'#f6fbff'}setTheme(saved||(pref?'dark':'light'));theme.onclick=()=>{const n=document.body.classList.contains('dark')?'light':'dark';localStorage.setItem('bernio-theme',n);setTheme(n)};document.getElementById('year').textContent=new Date().getFullYear();

/* alphabeticke-razeni */
function seraditAplikacePodleAbecedy(){
  const razeni = new Intl.Collator('cs', { sensitivity: 'base', numeric: true });
  document.querySelectorAll('.grid').forEach(grid => {
    const karty = [...grid.children].filter(el => el.classList.contains('card'));
    karty.sort((a, b) => {
      const nazevA = a.querySelector('.title span:nth-child(2)')?.textContent.trim() || '';
      const nazevB = b.querySelector('.title span:nth-child(2)')?.textContent.trim() || '';
      return razeni.compare(nazevA, nazevB);
    });
    karty.forEach(karta => grid.appendChild(karta));
  });
}
seraditAplikacePodleAbecedy();
document.addEventListener('DOMContentLoaded', seraditAplikacePodleAbecedy, { once: true });
</script></body></html>
