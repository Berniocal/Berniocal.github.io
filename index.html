function navCard(id,icon,title,description){return `<a class="card nav-card" href="#${esc(id)}"><div class="title"><span class="icon" aria-hidden="true">${icon}</span><span>${esc(title)}</span></div><div class="desc">${esc(description)}</div><span class="ghost">Otevřít</span></a>`}
function itemCard(x){if(x[0]==='sub')return navCard(x[1],x[2],x[3],x[4]);return `<article class="card"><div class="title"><span class="icon" aria-hidden="true">${x[1]}</span><span>${esc(x[2])}</span></div><div class="desc">${esc(x[4])}</div>${externalLink({label:'Otevřít '+x[2],url:x[5]},'btn')}</article>`}
function homeView(){return `<div class="grid">${HOME.map(x=>x[4]?`<a class="card nav-card" href="${esc(x[4])}"><div class="title"><span class="icon" aria-hidden="true">${x[1]}</span><span>${esc(x[2])}</span></div><div class="desc">${esc(x[3])}</div><span class="ghost">Otevřít</span></a>`:navCard(x[0],x[1],x[2],x[3])).join('')}</div>`}
function subjectView(key){const s=CURRICULUM[key];return `<h2 class="page-title">${s.icon} ${esc(s.title)}</h2><p class="section-intro">Vyber ročník. V něm najdeš kapitoly a témata jednotlivých hodin.</p>${['ZŠ','SŠ'].map(level=>`<h3 class="level-title">${level==='ZŠ'?'Základní škola':'Střední škola'}</h3><div class="grade-grid">${s.grades.filter(g=>g.title.endsWith(level)).map(g=>navCard(key+'-'+g.id,'',g.title,g.chapters.map(c=>c.title).join(' · '))).join('')}</div>`).join('')}<details class="general-tools"><summary>Společné nástroje a přehledy</summary><div class="tool-list">${s.general.map(x=>externalLink(x)).join('')}</div></details>`}
function lessonRow(r){return `<div class="lesson-row"><div class="lesson-topic">${r.lesson?`<a class="lesson-link" href="${esc(r.lesson.url)}" target="_blank" rel="noopener noreferrer" title="${esc(r.lesson.description)}">${esc(r.title)}</a><span class="lesson-hint">Zápis / výuka</span>`:`<span class="lesson-unavailable">${esc(r.title)}</span>`}</div><div class="lesson-practice"${r.practice.length?' aria-label="Procvičování"':''}>${r.practice.length?'<span class="mobile-label">Procvičování</span>':''}${r.practice.map(x=>externalLink(x)).join('')}</div><div class="lesson-tools"${r.tools.length?' aria-label="Pomůcky"':''}>${r.tools.length?'<span class="mobile-label">Pomůcky</span>':''}${r.tools.map(x=>externalLink(x)).join('')}</div></div>`}
function gradeView(key,g,openChapter){const route=key+'-'+g.id,s=CURRICULUM[key];return `<div class="grade-heading"><div><h2 class="page-title">${esc(s.title)} · ${esc(g.title)}</h2><p class="section-intro">Rozbal kapitolu. Podtržený název otevře zápis. Šedý název zatím nemá odkaz; dostupné procvičování a pomůcky najdeš vedle.</p></div><button class="ghost" type="button" id="toggleChapters">Rozbalit vše</button></div><nav class="grade-switch" aria-label="Změnit ročník">${s.grades.map(x=>routeLink(key+'-'+x.id,x.title,'grade-chip'+(x===g?' selected':''))).join('')}</nav><div class="chapters">${g.chapters.map(c=>{const id=route+'--'+c.id;return `<details class="chapter" id="${esc(id)}"${openChapter===c.id||chapterState.get(id)?' open':''}><summary><span>${esc(c.title)}</span><span class="topic-count">${topicCount(c.lessons.length)}</span></summary><div class="chapter-content">${c.preparation?`<div class="chapter-preparation">${externalLink(c.preparation,'resource preparation-link')}</div>`:''}<div class="lesson-columns" aria-hidden="true"><span>Téma hodiny</span><span>Procvičování</span><span>Pomůcky</span></div>${c.lessons.map(lessonRow).join('')}<div class="chapter-footer">${routeLink(id,'Odkaz na kapitolu','chapter-anchor')}</div></div></details>`}).join('')}</div>`}
function resolveRoute(){let id=decodeURIComponent(location.hash.slice(1))||'home';if(legacy[id]){id=legacy[id];history.replaceState(null,'','#'+id)}if(id==='home')return {id,title:'Hlavní menu'};if(CURRICULUM[id])return {id,subject:id,title:CURRICULUM[id].title};for(const key of subjectKeys){const grade=CURRICULUM[key].grades.find(g=>id===key+'-'+g.id||id.startsWith(key+'-'+g.id+'--'));if(grade)return {id,subject:key,grade,chapter:id.split('--')[1]||'',title:grade.title}}
 if(SECTIONS[id])return {id,title:NAMES[id]||id};return {id:'home',title:'Hlavní menu'}}
function breadcrumbs(r){let parts=[routeLink('home','Hlavní menu')];if(r.subject){parts.push(routeLink(r.subject,CURRICULUM[r.subject].title));if(r.grade)parts.push(`<strong>${esc(r.grade.title)}</strong>`)}else if(r.id!=='home'){const parent=PARENTS[r.id];if(parent&&parent!=='home')parts.push(routeLink(parent,NAMES[parent]));parts.push(`<strong>${esc(r.title)}</strong>`)}return parts.join('<span aria-hidden="true"> › </span>')}
function render(){const r=resolveRoute();document.querySelector('.breadcrumb').innerHTML=breadcrumbs(r);document.title=(r.id==='home'?'Bernio aplikace':(r.subject?CURRICULUM[r.subject].title+(r.grade?' · '+r.grade.title:''):r.title)+' | Bernio');const parent=r.grade?r.subject:r.subject?'home':PARENTS[r.id]||'home';views.innerHTML=(r.id==='home'?'':`<div class="top">${routeLink(parent,parent==='home'?'Zpět na hlavní menu':r.grade?'Zpět na výběr ročníku':'Zpět do sekce '+NAMES[parent],'ghost back')}</div>`)+(r.grade?gradeView(r.subject,r.grade,r.chapter):r.subject?subjectView(r.subject):r.id==='home'?homeView():`<h2 class="page-title">${esc(r.title)}</h2><div class="grid">${[...SECTIONS[r.id]].sort((a,b)=>a[2].localeCompare(b[2],'cs')).map(itemCard).join('')}</div>`);if(r.grade){for(const d of views.querySelectorAll('.chapter'))d.addEventListener('toggle',()=>{chapterState.set(d.id,d.open);updateExpandButton()});document.getElementById('toggleChapters').addEventListener('click',()=>{const ds=[...views.querySelectorAll('.chapter')],open=ds.some(d=>!d.open);ds.forEach(d=>{d.open=open;chapterState.set(d.id,open)});updateExpandButton()});updateExpandButton()}runSearch();if(r.chapter)requestAnimationFrame(()=>document.getElementById(r.id)?.scrollIntoView({block:'start'}));else scrollTo(0,0)}
function updateExpandButton(){const b=document.getElementById('toggleChapters');if(b)b.textContent=[...views.querySelectorAll('.chapter')].some(d=>!d.open)?'Rozbalit vše':'Sbalit vše'}
const searchInput=document.getElementById('siteSearch'),searchClear=document.getElementById('searchClear'),searchPanel=document.getElementById('searchPanel'),searchGrid=document.getElementById('searchGrid'),searchSummary=document.getElementById('searchSummary'),searchEmpty=document.getElementById('searchEmpty');
const SEARCH_TOPICS=subjectKeys.flatMap(subject=>CURRICULUM[subject].grades.flatMap(grade=>grade.chapters.flatMap(chapter=>chapter.lessons.map(row=>({subject,grade,chapter,row,path:subject+'-'+grade.id+'--'+chapter.id,haystack:norm([CURRICULUM[subject].title,grade.title,chapter.title,row.title,row.lesson?.description,...row.practice.concat(row.tools).flatMap(x=>[x.label,x.description])].join(' '))})))));
const SEARCH_APPS=(()=>{const all=new Map();for(const [section,items]of Object.entries(SECTIONS)){for(const x of items.filter(x=>x[0]==='app')){const url=new URL(x[5],location.origin).href.replace(/\/$/,'');if(!all.has(url))all.set(url,{icon:x[1],title:x[2],url:x[5],description:x[4],sections:[],keywords:x[6]||''});const a=all.get(url);if(['hry','hudba','jine','vedator'].includes(section))a.sections.push(NAMES[section])}}for(const [key,s]of Object.entries(CURRICULUM))for(const x of s.general){const a=all.get(new URL(x.url,location.origin).href.replace(/\/$/,''));if(a)a.sections.push(s.title+' · společné nástroje')}return [...all.values()].filter(a=>a.sections.length).map(a=>({...a,haystack:norm([a.title,a.description,...a.sections,a.keywords].join(' '))}))})();
function runSearch(){const q=norm(searchInput.value);searchClear.hidden=!q;if(!q){searchPanel.hidden=true;views.hidden=false;return}const terms=q.split(' '),matches=x=>terms.every(t=>x.haystack.includes(t));const topics=SEARCH_TOPICS.filter(matches),apps=SEARCH_APPS.filter(matches);searchGrid.innerHTML=topics.map(x=>`<article class="search-topic"><div class="search-location">${routeLink(x.path,CURRICULUM[x.subject].title+' · '+x.grade.title+' · '+x.chapter.title)}</div>${lessonRow(x.row)}</article>`).join('')+(apps.length?`<div class="grid app-results">${apps.map(x=>`<article class="card"><div class="title"><span class="icon" aria-hidden="true">${x.icon}</span><span>${esc(x.title)}</span></div><div class="muted">${esc([...new Set(x.sections)].join(' · '))}</div><div class="desc">${esc(x.description)}</div>${externalLink({label:'Otevřít '+x.title,url:x.url},'btn')}</article>`).join('')}</div>`:'');searchSummary.textContent=`Nalezeno: ${topics.length+apps.length}`;searchEmpty.hidden=topics.length+apps.length!==0;searchPanel.hidden=false;views.hidden=true}
searchInput.addEventListener('input',runSearch);searchClear.addEventListener('click',()=>{searchInput.value='';runSearch();searchInput.focus()});searchInput.addEventListener('keydown',event=>{if(event.key==='Escape'){searchInput.value='';runSearch()}});searchGrid.addEventListener('click',event=>{if(event.target.closest('a[href^="#"]')){searchInput.value='';runSearch()}});
addEventListener('hashchange',render);
const theme=document.getElementById('theme');let saved;try{saved=localStorage.getItem('bernio-theme')}catch{}const pref=matchMedia('(prefers-color-scheme:dark)').matches;
function setTheme(t){const d=t==='dark';document.body.classList.toggle('dark',d);theme.textContent=d?'☀️ Světlý režim':'🌙 Tmavý režim';document.querySelector('meta[name="theme-color"]').content=d?'#0b1323':'#f6fbff'}setTheme(saved||(pref?'dark':'light'));theme.onclick=()=>{const n=document.body.classList.contains('dark')?'light':'dark';try{localStorage.setItem('bernio-theme',n)}catch{}setTheme(n)};
document.getElementById('year').textContent=new Date().getFullYear();render();
</script></body></html>
