name: Add prevody to Fyzika

on:
  push:
    paths:
      - '.github/workflows/add-prevody-to-fyzika.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add conversion generator to physics section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          anchor = '["app","🔌","Obvody","/obvody","Interaktivní elektrické obvody, výpočty a simulace chování součástek.","https://bernio.cz/obvody"]'
          new_item = '["app","🔄","Převody jednotek","/pocitadla/prevody","Generátor převodů fyzikálních jednotek pro ZŠ i SŠ s nastavitelnými veličinami a výsledky.","https://bernio.cz/pocitadla/prevody"]'
          if new_item not in text:
              if anchor not in text:
                  raise SystemExit('Physics section anchor not found')
              text = text.replace(anchor, anchor + ',' + new_item, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add unit conversions to physics menu"
          git push
