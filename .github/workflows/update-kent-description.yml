name: Update Kent description

on:
  push:
    paths:
      - '.kent-desc-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update directory text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='Týmová karetní hra Kent pro 4 hráče na telefonech se sdílenou online místností.'
          new='Týmová karetní hra Kent pro sudý počet hráčů na telefonech, včetně režimu hry na dálku.'
          if old not in s:
              raise SystemExit('Old Kent description not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Bernio"
          git config user.email "jendabernard@gmail.com"
          git add index.html
          git rm .kent-desc-trigger
          git commit -m "Update Kent multiplayer description"
          git push
