name: Sort app cards alphabetically

on:
  push:
    branches:
      - alphabetical-app-order

permissions:
  contents: write

jobs:
  sort:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alphabetical-app-order
          fetch-depth: 0

      - name: Add Czech alphabetical sorting
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          marker = "/* alphabeticke-razeni */"

          if marker not in text:
              sorting_code = r'''
          /* alphabeticke-razeni */
          function seraditAplikacePodleAbecedy(){
            const razeni = new Intl.Collator('cs', { sensitivity: 'base', numeric: true });
            document.querySelectorAll('.grid').forEach(grid => {
              const karty = [...grid.children].filter(el => el.classList.contains('card'));
              karty.sort((a, b) => {
                const nazevA = a.querySelector('.title span:nth-child(2)')?.textContent.trim() || '';
                const nazevB = b.querySelector('.title span:nth-child(2)')?.textContent.trim() || '';
                return razeni.compare(nazevA, nazevB);
              });
              karty.forEach(karta => grid.appendChild(karta));
            });
          }
          seraditAplikacePodleAbecedy();
          document.addEventListener('DOMContentLoaded', seraditAplikacePodleAbecedy, { once: true });
          '''
              position = text.rfind("</script>")
              if position == -1:
                  raise RuntimeError("V index.html nebyl nalezen zaviraci tag </script>.")
              text = text[:position] + sorting_code + text[position:]
              index.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/sort-index.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Commit sorted order
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/sort-index.yml
          git commit -m "Sort all app cards alphabetically"
          git push origin HEAD:alphabetical-app-order
