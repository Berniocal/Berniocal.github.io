<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funkce s absolutní hodnotou</title></head><body><p style="font-family:system-ui;padding:20px">Načítám funkci s absolutní hodnotou…</p><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/Berniocal/funkce/main/_source/absolutni.html.gz.b64');if(!r.ok)throw new Error('source');const b64=(await r.text()).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<p style="font-family:system-ui;padding:20px;color:#b42318">Aplikaci se nepodařilo načíst.</p>';console.error(e)}})();</script></body></html>
