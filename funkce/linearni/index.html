<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lineární funkce</title></head><body><p style="font-family:system-ui;padding:20px">Načítám lineární funkce…</p><script>(async()=>{try{const base='https://raw.githubusercontent.com/Berniocal/funkce/main/_source/linearni_parts/';const names=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt'];let b64='';for(const name of names){const r=await fetch(base+name);if(!r.ok)throw new Error('source '+name);b64+=(await r.text()).trim()}const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<p style="font-family:system-ui;padding:20px;color:#b42318">Aplikaci se nepodařilo načíst.</p>';console.error(e)}})();</script></body></html>
